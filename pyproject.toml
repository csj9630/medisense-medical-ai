[project]
name = "thegpt-ai"
version = "0.1.0"
description = "backend/scripts/Colab에서 공통으로 재사용하는 AI 로직 (OCR/RAG/LLM/상담/평가)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
